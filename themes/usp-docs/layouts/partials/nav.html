{{- $root := site.Home -}}
{{- with .docset }}{{ $root = . }}{{ end -}}
<nav class="usp-nav" aria-label="Navigation">
  <div class="usp-nav__title">{{ .siteTitle }}</div>
  <ul>
    {{ partial "nav-item.html" (dict "item" $root "page" .page "asLink" true) }}
    {{- range $root.Pages.ByWeight }}
      {{ partial "nav-item.html" (dict "item" . "page" $.page "asLink" $root.IsHome) }}
    {{- end }}
  </ul>
</nav>
