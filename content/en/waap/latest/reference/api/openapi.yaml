---
openapi: 3.1.0
components:
  schemas:
    AccessMode:
      type: string
      enum:
      - block_listed
      - allow_listed
    AcmeProviderDto:
      description: Holds the information about Automatic certificate renewal (ACME)
        provider
      type: object
      properties:
        id:
          type: string
          description: Provider's id
        name:
          type: string
          description: Provider's name
          pattern: \S
        certificateAuthorityUrl:
          type: string
          description: Certificate authority URL
          pattern: \S
        trustedCaCertificateId:
          type: string
          description: Trusted CA Certificate
        skipCertificateValidation:
          type: boolean
          description: Certificate validation will be skipped
        emailAddress:
          type: string
          description: Email address
          pattern: \S
        keyType:
          description: Key type
          type: string
          $ref: "#/components/schemas/SupportedKeyType"
        eabKeyId:
          type: string
          description: "External Account Binding (EAB): Key ID"
        eabHmacKey:
          type: string
          description: "External Account Binding (EAB): HMAC Key"
      required:
      - name
      - certificateAuthorityUrl
      - emailAddress
      - keyType
    AllowClass:
      type: string
      enum:
      - RESTRICTED
      - STANDARD
      - EXTENDED
    AttributeManipulationDto:
      type: object
      required:
      - name
      - action
      properties:
        name:
          type: string
          description: Attribute name
          pattern: \S
        value:
          type: string
          description: Attribute value
          maxLength: 4096
        action:
          $ref: "#/components/schemas/CookieAttributeMutationAction"
    BackendDto:
      description: Holds the information about backend
      type: object
      required:
      - id
      - timeoutsLimits
      properties:
        id:
          type: string
          description: Id of the backend
          readOnly: true
        settings:
          description: General backend settings
          type: object
          $ref: "#/components/schemas/BackendSettingsDto"
        tls:
          description: Backend's TLS settings
          type: object
          $ref: "#/components/schemas/BackendTlsDto"
        healthCheck:
          description: Backend's Health Check settings
          type: object
          $ref: "#/components/schemas/BackendHealthCheckDto"
        references:
          type: array
          items:
            $ref: "#/components/schemas/BackendReferenceVhostDto"
          description: Backend's references in Virtual Host routes
        timeoutsLimits:
          description: Backend's timeouts and limits
          type: object
          $ref: "#/components/schemas/BackendTimeoutsLimitsDto"
    BackendEndpointDto:
      type: object
      description: Backend endpoint
      required:
      - address
      - port
      properties:
        address:
          type: string
          description: Backend address (FQDN or IP)
          pattern: \S
        port:
          type: integer
          format: int32
          description: Backend port
          maximum: 65535
          minimum: 1
        hostHeader:
          type: string
          description: Backend host header
    BackendHealthCheckDto:
      type: object
      description: Holds the information about backend's Health Check settings
      properties:
        checkIntervalSec:
          type: integer
          format: int32
          description: Time between active health checks (in seconds)
          maximum: 99999
          minimum: 0
        requestTimeoutSec:
          type: integer
          format: int32
          description: Time to wait for a health check response (in seconds)
          maximum: 99999
          minimum: 0
        unhealthyThreshold:
          type: integer
          format: int32
          description: Number of unhealthy health checks required before a backend
            host is marked unhealthy
          minimum: 0
        healthyThreshold:
          type: integer
          format: int32
          description: Number of healthy health checks required before a backend host
            is marked healthy
          minimum: 0
        type:
          description: Type of health checking
          type: string
          $ref: "#/components/schemas/BackendHealthCheckType"
        httpSettings:
          description: Settings for HTTP health checking. It’s required while the
            health checker type is HTTP
          type: object
          $ref: "#/components/schemas/BackendHealthCheckHttpSettingsDto"
        comments:
          type: string
          description: Comments about backend's Health Check settings
      required:
      - type
    BackendHealthCheckHttpSettingsDto:
      type: object
      description: Settings for HTTP health checking
      properties:
        hostname:
          type: string
          description: HTTP host that will be requested during health checking (uses
            endpoint's address if not specified)
        path:
          type: string
          description: HTTP path that will be requested during health checking
          pattern: \S
          maxLength: 1024
        method:
          description: HTTP method used for health checking (uses GET if not specified)
          type: string
          $ref: "#/components/schemas/BackendHealthCheckMethod"
        expectedStatusCode:
          type: integer
          format: int32
          description: HTTP response status considered healthy (uses 200 if not specified)
          maximum: 599
          minimum: 100
      required:
      - path
    BackendHealthCheckMethod:
      type: string
      enum:
      - GET
      - HEAD
      - OPTIONS
    BackendHealthCheckType:
      type: string
      enum:
      - TCP
      - HTTP
    BackendReferenceRouteDto:
      type: object
      description: Holds the information about backend reference's route
      properties:
        vhostId:
          type: string
          description: Virtual host id
        routeId:
          type: string
          description: Route id
        description:
          type: string
          description: Route description
    BackendReferenceVhostDto:
      type: object
      description: Holds the information about backend reference's vhost
      properties:
        description:
          type: string
          description: Virtual host description
        routes:
          type: array
          items:
            $ref: "#/components/schemas/BackendReferenceRouteDto"
          description: Virtual host routes
    BackendSettingsDto:
      type: object
      description: Holds the information about general backend settings
      required:
      - name
      - loadBalancer
      properties:
        name:
          type: string
          description: Backend name
          pattern: \S
        endpoints:
          type: array
          items:
            $ref: "#/components/schemas/BackendEndpointDto"
          description: Type of the Load Balancer for Backend
        loadBalancer:
          description: Type of the Load Balancer for Backend
          type: string
          $ref: "#/components/schemas/LoadBalancer"
        backendStickiness:
          type: boolean
          description: Backend Stickiness
        comments:
          type: string
          description: Comments about general backend settings
    BackendTimeoutsLimitsDto:
      type: object
      description: Holds the information about general backend timeouts and limits
      required:
      - connectionTimeout
      - connectionIdleTimeout
      - maxConnections
      - maxPendingRequests
      - maxParallelRequests
      properties:
        connectionTimeout:
          type: string
          description: Backend's connection timeout
          pattern: \S
        connectionIdleTimeout:
          type: string
          description: Backend's connection idle timeout
          pattern: \S
        maxConnections:
          type: integer
          format: int64
          description: Backend's max connections
          minimum: 1
        maxPendingRequests:
          type: integer
          format: int64
          description: Backend's max pending requests
          minimum: 1
        maxParallelRequests:
          type: integer
          format: int64
          description: Backend's max parallel requests
          minimum: 1
        comments:
          type: string
          description: Comments about general backend limits and timeouts
    BackendTlsDto:
      type: object
      description: Holds the information about backend's TLS settings
      properties:
        trustedCaCertificateId:
          type: string
          description: TLS certificates of the Certificate Authorities that can be
            used as a trust anchor to validate the certificates presented by the backend
        skipCertificateValidation:
          type: boolean
          description: Trusted CA certificate validation is not mandatory
        sniHostname:
          type: string
          description: SNI Hostname
        clientAuthenticationCertificateId:
          type: string
          description: Id of a certificate used fot Client Authentication or null
            disable it
        customTlsVersions:
          description: Custom TLS Versions settings
          type: object
          $ref: "#/components/schemas/CustomTlsVersions"
        customCiphersAndAlgorithms:
          description: Customization of supported Ciphers and Algorithms
          type: object
          $ref: "#/components/schemas/CustomCiphersAndAlgorithmsDto"
        comments:
          type: string
          description: Comments about backend's TLS settings
    CaCertificateDetailedInfoDto:
      type: object
      properties:
        id:
          type: string
        alias:
          type: string
        content:
          type: string
    CaCertificateDownloadFormat:
      description: CA certificate download formats
      type: string
      enum:
      - PEM
      - DER
      - PKCS7
    CaCertificateInfoDto:
      description: CA certificate info
      type: object
      properties:
        subject:
          type: string
        issuer:
          type: string
        subjectElements:
          type: array
          items:
            type: object
            required:
            - key
            - value
            properties:
              key:
                type: string
              value:
                type: string
        issuerElements:
          type: array
          items:
            type: object
            required:
            - key
            - value
            properties:
              key:
                type: string
              value:
                type: string
        validFrom:
          type: string
          format: date
          examples:
          - 2022-03-10
        validUntil:
          type: string
          format: date
          examples:
          - 2022-03-10
        commonNames:
          type: array
          items:
            type: string
        keyUsage:
          type: array
          items:
            $ref: "#/components/schemas/KeyUsageName"
        signatureAlgorithm:
          type: string
        keySize:
          type: integer
          format: int32
        keyType:
          $ref: "#/components/schemas/SupportedKeyType"
        fingerprint:
          type: string
        serialNumber:
          type: string
        isCaCertificate:
          type: boolean
        isSelfSigned:
          type: boolean
        subjectAlternativeNames:
          type: array
          items:
            type: object
            required:
            - key
            - value
            properties:
              key:
                type: string
              value:
                type: string
        notYetValid:
          type: boolean
        expired:
          type: boolean
        keyOnly:
          type: boolean
        id:
          type: string
          description: Certificate id
        alias:
          type: string
          description: Certificate alias (optional)
        aliasLabel:
          type: string
          description: Certificate alias label (alias or certificate's common name)
        inUse:
          type: boolean
          description: Certificate is in use in the configuration
      required:
      - keyType
      - fingerprint
      - keyOnly
      - id
      - aliasLabel
      - inUse
    CertificateDetailedInfoDto:
      type: object
      properties:
        id:
          type: string
        alias:
          type: string
        content:
          type: string
        keyContent:
          type: string
    CertificateDownloadFormat:
      description: Certificate download formats
      type: string
      enum:
      - PEM
      - DER
      - PKCS12
      - JKS
    CertificateInfoDto:
      description: Certificate info
      type: object
      properties:
        subject:
          type: string
        issuer:
          type: string
        subjectElements:
          type: array
          items:
            type: object
            required:
            - key
            - value
            properties:
              key:
                type: string
              value:
                type: string
        issuerElements:
          type: array
          items:
            type: object
            required:
            - key
            - value
            properties:
              key:
                type: string
              value:
                type: string
        validFrom:
          type: string
          format: date
          examples:
          - 2022-03-10
        validUntil:
          type: string
          format: date
          examples:
          - 2022-03-10
        commonNames:
          type: array
          items:
            type: string
        keyUsage:
          type: array
          items:
            $ref: "#/components/schemas/KeyUsageName"
        signatureAlgorithm:
          type: string
        keySize:
          type: integer
          format: int32
        keyType:
          $ref: "#/components/schemas/SupportedKeyType"
        fingerprint:
          type: string
        serialNumber:
          type: string
        isCaCertificate:
          type: boolean
        isSelfSigned:
          type: boolean
        subjectAlternativeNames:
          type: array
          items:
            type: object
            required:
            - key
            - value
            properties:
              key:
                type: string
              value:
                type: string
        notYetValid:
          type: boolean
        expired:
          type: boolean
        keyOnly:
          type: boolean
        id:
          type: string
          description: Certificate id
        alias:
          type: string
          description: Certificate alias (optional)
        aliasLabel:
          type: string
          description: Certificate alias label (alias or certificate's common name)
        inUse:
          type: boolean
          description: Certificate is in use in the configuration
      required:
      - keyType
      - fingerprint
      - keyOnly
      - id
      - aliasLabel
      - inUse
    CertificateSubjectForm:
      type: object
      required:
      - commonName
      properties:
        commonName:
          type: string
          pattern: \S
          maxLength: 64
        alternativeDomainNames:
          type: string
        country:
          type: string
        stateOrProvince:
          type: string
        locality:
          type: string
        organization:
          type: string
        organizationalUnit:
          type: string
        emailAddress:
          type: string
    CertificatesDataDto:
      description: Holds the information about certificates available for virtual
        host
      type: object
      properties:
        certificates:
          type: array
          items:
            $ref: "#/components/schemas/CertificateInfoDto"
          description: A list of certificate infos
        caCertificates:
          type: array
          items:
            $ref: "#/components/schemas/CaCertificateInfoDto"
          description: A list of CA certificate infos
        acmeProviders:
          type: array
          items:
            $ref: "#/components/schemas/AcmeProviderDto"
          description: A list of Automatic certificate renewal (ACME) providers
    CertificatesDetailedDataDto:
      description: Holds the information about certificates available for virtual
        host
      type: object
      properties:
        certificates:
          type: array
          items:
            $ref: "#/components/schemas/CertificateDetailedInfoDto"
          description: A list of detailed certificate infos
        caCertificates:
          type: array
          items:
            $ref: "#/components/schemas/CaCertificateDetailedInfoDto"
          description: A list of detailed CA certificate infos
        acmeProviders:
          type: array
          items:
            $ref: "#/components/schemas/AcmeProviderDto"
          description: A list of Automatic certificate renewal (ACME) providers
    ClientCertificateValidationDto:
      type: object
      description: Client Certificate Validation settings
      properties:
        optionalValidation:
          type: boolean
          description: Accept connections even when a client doesn’t present a certificate
        trustedCaCertificateId:
          type: string
          description: TLS certificate of the Certificate Authorities that can be
            used as a trust anchor to validate the certificates presented by the client
        sanMatches:
          type: array
          items:
            $ref: "#/components/schemas/SanMatchDto"
          description: "A list of Subject Alternative Name matchers. If specified,\
            \ it will be verified that the Subject Alternative Name of the presented\
            \ certificate matches one of the specified matchers"
        forwardXfccHttpHeader:
          type: boolean
          description: Forward Client Certificate information with XFCC HTTP Header
    ConfigurationValidationError:
      type: object
      required:
      - type
      - arguments
      properties:
        type:
          $ref: "#/components/schemas/ConfigurationValidationErrorType"
        arguments:
          type: array
          items:
            type: string
    ConfigurationValidationErrorType:
      type: string
      enum:
      - INCOMPATIBLE_COMPONENT_VERSION
      - HOST_NON_EXISTING_CONFIGURED_INTERFACE
      - HOST_AT_LEAST_TWO_CONFIGURED_INTERFACES_REQUIRED
      - HOST_HA_UNAVAILABLE_FOR_DHCP
      - HOST_SYSTEM_HOSTNAME_NOT_IN_HA_CONFIG
      - HOST_SYSTEM_IP_NOT_IN_HA_CONFIG
      - WAAP_EXTERNAL_IFACE_NOT_CONFIGURED
      - WAAP_MISSING_LISTENER_IP
    CookieAttributeMutationAction:
      type: string
      enum:
      - REMOVE
      - ADD_IF_ABSENT
      - OVERWRITE_IF_EXISTS
      - OVERWRITE_IF_EXISTS_OR_ADD
    CookieManipulationDto:
      description: Cookie manipulation for request 'Cookie' and response 'Set-Cookie'
        headers
      type: object
      properties:
        request:
          type: array
          items:
            $ref: "#/components/schemas/RequestManipulationDto"
          description: Request-side cookie manipulations (applied to 'Cookie' headers)
          maxItems: 64
        response:
          type: array
          items:
            $ref: "#/components/schemas/ResponseManipulationDto"
          description: Response-side cookie manipulations (applied to 'Set-Cookie'
            headers)
          maxItems: 64
    CookieRequestMutationAction:
      type: string
      enum:
      - REMOVE
      - ADD_IF_ABSENT
      - OVERWRITE_IF_EXISTS
      - OVERWRITE_IF_EXISTS_OR_ADD
    CookieResponseMutationAction:
      type: string
      enum:
      - REMOVE
      - ADD_IF_ABSENT
      - OVERWRITE_IF_EXISTS
      - OVERWRITE_IF_EXISTS_OR_ADD
      - MODIFY_ATTRIBUTES_IF_COOKIE_PRESENT
    CoreRuleSetMode:
      description: Core rule set operational mode
      type: string
      enum:
      - Disabled
      - Detect
      - Block
    CreateCertificateSigningRequestFormData:
      description: Holds the form data required to display Create self-signed certificate
        dialog
      type: object
      properties:
        existingKeys:
          type: array
          items:
            $ref: "#/components/schemas/CertificateInfoDto"
          description: A list of existing private keys
        keyTypeList:
          type: array
          items:
            type: string
          description: A list of supported Key types
    CreateSelfSignedCertificateFormData:
      description: Holds the form data required to display Create self-signed certificate
        dialog
      type: object
      required:
      - keyTypeList
      properties:
        keyTypeList:
          type: array
          items:
            type: string
          description: A list of supported Key types
    CrossOriginEmbedderPolicy:
      type: string
      enum:
      - REQUIRE_CORP
      - CREDENTIALLESS
      - UNSAFE_NONE
    CrossOriginOpenerPolicy:
      type: string
      enum:
      - SAME_ORIGIN
      - SAME_ORIGIN_ALLOW_POPUPS
      - UNSAFE_NONE
    CrossOriginResourcePolicy:
      type: string
      enum:
      - SAME_ORIGIN
      - SAME_SITE
      - CROSS_ORIGIN
    CrossOriginResourceSharingDto:
      type: object
      required:
      - allowOrigins
      properties:
        allowOrigins:
          type: array
          items:
            type: string
            pattern: \S
            maxLength: 253
          description: Origins allowed to make cross-origin requests
          maxItems: 256
          minItems: 1
        allowMethods:
          type: array
          items:
            type: string
            pattern: GET|HEAD|POST|PUT|PATCH|DELETE|CONNECT|OPTIONS|TRACE
          description: HTTP methods allowed for cross-origin requests
          maxItems: 16
        allowHeaders:
          type: array
          items:
            type: string
            pattern: \S
          description: Request headers the browser may send
          maxItems: 256
        exposeHeaders:
          type: array
          items:
            type: string
            pattern: \S
          description: Response headers made readable to browser scripts
          maxItems: 256
        allowCredentials:
          type: boolean
          description: "Whether cookies, authorization headers or TLS client certificates\
            \ are allowed"
        maxAgeSeconds:
          type: integer
          format: int32
          description: How long (in seconds) the browser may cache the preflight result
          minimum: 0
    CustomCiphersAndAlgorithmsDto:
      type: object
      description: Customization of supported Ciphers and Algorithms
      properties:
        cipherSuites:
          type: string
          description: Cipher Suites for TLS 1.2 and older
        ecdhCurves:
          type: string
          description: ECDH curves
        signatureAlgorithms:
          type: string
          description: Signature Algorithms
    CustomTlsVersions:
      type: object
      description: Custom TLS Versions settings
      properties:
        tlsVersion13:
          type: boolean
          description: Support TLS version 1.3
        tlsVersion12:
          type: boolean
          description: Support TLS version 1.2
        tlsVersion11:
          type: boolean
          description: Support TLS version 1.1
        tlsVersion10:
          type: boolean
          description: Support TLS version 1.0
    EditAcmeProviderFormData:
      description: Holds the form data required to display Edit ACME provider dialog
      type: object
      required:
      - keyTypeList
      - caCertificates
      properties:
        keyTypeList:
          type: array
          items:
            type: string
          description: A list of supported Key types
        caCertificates:
          type: array
          items:
            $ref: "#/components/schemas/CaCertificateInfoDto"
          description: A list of available CA certificates
    ErrorPageHeaderConditionDto:
      description: Additional header condition narrowing down when an error page is
        served
      type: object
      required:
      - type
      - name
      - matchType
      - value
      properties:
        type:
          description: Source where to take the header from
          type: string
          $ref: "#/components/schemas/ErrorPageHeaderConditionType"
        name:
          type: string
          description: "Name of the header to match, case-insensitive"
          pattern: \S
        matchType:
          description: How the header value is compared
          type: string
          $ref: "#/components/schemas/ErrorPageHeaderConditionMatchType"
        value:
          type: string
          description: Value the header is compared against
          pattern: \S
          maxLength: 4096
    ErrorPageHeaderConditionMatchType:
      type: string
      enum:
      - EXACT
      - CONTAINS
      - PREFIX
      - SUFFIX
      - REGEX
    ErrorPageHeaderConditionType:
      type: string
      enum:
      - RESPONSE
    ErrorPageResponseStatusCode:
      type: string
      enum:
      - STATUS_4xx
      - STATUS_400
      - STATUS_401
      - STATUS_403
      - STATUS_404
      - STATUS_405
      - STATUS_5xx
      - STATUS_500
      - STATUS_501
      - STATUS_502
      - STATUS_503
      - STATUS_504
      - STATUS_505
    ErrorResponse:
      description: Provides the information about invalid request
      type: object
      required:
      - reason
      properties:
        reason:
          type: string
          description: Reason for request to be considered invalid
    FolderStaticContentEntryForm:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          description: Name of the static content entry
          pattern: \S
    HeaderFilterDenyPattern:
      type: object
      required:
      - name
      - pattern
      properties:
        name:
          type: string
          pattern: \S
        pattern:
          type: string
          pattern: \S
    HeaderFilterRequest:
      type: object
      required:
      - allowClass
      properties:
        allowClass:
          description: Header class
          type: string
          $ref: "#/components/schemas/AllowClass"
        allowedHeaders:
          type: array
          items:
            type: string
            pattern: \S
          description: List of headers that are explicitly allowed
        deniedHeaders:
          type: array
          items:
            type: string
            pattern: \S
          description: List of headers that are explicitly denied
        denyPatterns:
          type: array
          items:
            $ref: "#/components/schemas/HeaderFilterDenyPattern"
          description: List of headers that are denied by header value
    HeaderFilterResponse:
      type: object
      properties:
        allowedHeaders:
          type: array
          items:
            type: string
            pattern: \S
          description: List of headers that are explicitly allowed
        deniedHeaders:
          type: array
          items:
            type: string
            pattern: \S
          description: List of headers that are explicitly denied
        denyPatterns:
          type: array
          items:
            $ref: "#/components/schemas/HeaderFilterDenyPattern"
          description: List of headers that are denied by header value
    HeaderFilteringDto:
      type: object
      properties:
        enabled:
          type: boolean
          description: Whether to enable header filtering or not
        logOnly:
          type: boolean
          description: Whether header filtering should remove header or only log what
            would be removed
        request:
          description: Header filter request settings
          type: object
          $ref: "#/components/schemas/HeaderFilterRequest"
        response:
          description: Header filter response settings
          type: object
          $ref: "#/components/schemas/HeaderFilterResponse"
    HeaderManipulationAction:
      type: string
      enum:
      - ADD
      - SET
      - REMOVE
      - ADD_IF_ABSENT
      - OVERWRITE_IF_EXISTS
    HeaderManipulationDto:
      type: object
      required:
      - action
      - headerName
      properties:
        action:
          $ref: "#/components/schemas/HeaderManipulationAction"
        headerName:
          type: string
          pattern: \S
        value:
          type: string
    HeaderValidationMode:
      type: string
      enum:
      - Disabled
      - Detect
      - Block
    HttpMethod:
      type: string
      enum:
      - ACL
      - BASELINE_CONTROL
      - BIND
      - CHECKIN
      - CHECKOUT
      - CONNECT
      - COPY
      - DELETE
      - GET
      - HEAD
      - LABEL
      - LINK
      - LOCK
      - MERGE
      - MKACTIVITY
      - MKCALENDAR
      - MKCOL
      - MKREDIRECTREF
      - MKWORKSPACE
      - MOVE
      - OPTIONS
      - ORDERPATCH
      - PATCH
      - POST
      - PRI
      - PROPFIND
      - PROPPATCH
      - PUT
      - QUERY
      - REBIND
      - REPORT
      - SEARCH
      - TRACE
      - UNBIND
      - UNCHECKOUT
      - UNLINK
      - UNLOCK
      - UPDATE
      - UPDATEREDIRECTREF
      - VERSION_CONTROL
    HttpScheme:
      type: string
      enum:
      - NOT_SET
      - HTTP
      - HTTPS
    IPsDto:
