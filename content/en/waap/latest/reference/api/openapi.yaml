          description: Type of the matcher
          type: string
          $ref: "#/components/schemas/SanMatchType"
        matcher:
          description: Specifies how to match against a string
          type: string
          $ref: "#/components/schemas/SanMatchMatcher"
        value:
          type: string
          description: Specifies the string value that the match must have
          pattern: \S
          maxLength: 1024
        oid:
          type: string
          description: OID Value
    SanMatchMatcher:
      type: string
      enum:
      - EXACT
      - PREFIX
      - SUFFIX
      - REGEX
    SanMatchType:
      type: string
      enum:
      - EMAIL
      - OTHER_NAMES
    SecRuleCategoryDto:
      description: Groups security rules by category
      type: object
      properties:
        id:
          type: string
          description: Category identifier
        name:
          type: string
          description: Human readable category name
        secRuleExecutionPhase:
          description: Execution phase of the category
          type: string
          $ref: "#/components/schemas/SecRuleExecutionPhaseDto"
        rules:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/SecRuleDto"
          description: Rules belonging to this category
    SecRuleDto:
      type: object
      description: Represents a security rule
      properties:
        ruleCategory:
          description: Category this rule belongs to
          type: object
          $ref: "#/components/schemas/SecRuleCategoryDto"
        id:
          type: string
          description: Rule identifier
        name:
          type: string
          description: Human readable rule name
        paranoiaLevel:
          type: integer
          format: int32
          description: Paranoia level of the rule
        phase:
          type: integer
          format: int32
          description: Execution phase of the rule
        severity:
          description: Severity of the rule
          type: string
          $ref: "#/components/schemas/SecRuleSeverityDto"
        targets:
          type: array
          items:
            $ref: "#/components/schemas/SecRuleTargetDto"
          description: Targets affected by this rule
        direction:
          type: string
          description: Rule direction (Request or Response)
        ruleCategoryId:
          type: integer
          format: int32
          description: Rule category identifier from ruleset
        ruleCategoryName:
          type: string
          description: Rule category name from ruleset
        type:
          type: string
          description: Rule type
    SecRuleExecutionPhaseDto:
      type: string
      enum:
      - REQUEST
      - RESPONSE
    SecRuleSeverityDto:
      type: string
      enum:
      - NOTICE
      - WARNING
      - ERROR
      - CRITICAL
    SecRuleTargetDto:
      type: object
      description: Defines a target for a security rule
      properties:
        requestPartType:
          description: Request part type the rule applies to
          type: string
          $ref: "#/components/schemas/RequestPartType"
        requestPartNames:
          type: array
          items:
            type: string
          description: Names of the request parts
    SecurityResponseHeaderDto:
      type: object
      description: HTTP security response headers sent to the client
      properties:
        contentTypeOptions:
          type: boolean
          description: "Whether to send X-Content-Type-Options: nosniff"
        frameOptions:
          description: X-Frame-Options header value
          type: string
          $ref: "#/components/schemas/XFrameOptions"
        referrerPolicy:
          description: Referrer-Policy header value
          type: string
          $ref: "#/components/schemas/ReferrerPolicy"
        contentSecurityPolicy:
          type: string
          description: Content-Security-Policy header value
          maxLength: 8192
        contentSecurityPolicyReportOnly:
          type: string
          description: Content-Security-Policy-Report-Only header value
          maxLength: 8192
        crossOriginOpenerPolicy:
          description: Cross-Origin-Opener-Policy header value
          type: string
          $ref: "#/components/schemas/CrossOriginOpenerPolicy"
        crossOriginEmbedderPolicy:
          description: Cross-Origin-Embedder-Policy header value
          type: string
          $ref: "#/components/schemas/CrossOriginEmbedderPolicy"
        crossOriginResourcePolicy:
          description: Cross-Origin-Resource-Policy header value
          type: string
          $ref: "#/components/schemas/CrossOriginResourcePolicy"
        crossOriginResourceSharing:
          description: Cross-Origin Resource Sharing (CORS) settings
          type: object
          $ref: "#/components/schemas/CrossOriginResourceSharingDto"
    StaticContentEntryContentType:
      type: string
      enum:
      - BINARY
      - TEXT_PLAIN
      - TEXT_HTML
      - TEXT_CSS
      - TEXT_JAVASCRIPT
      - APPLICATION_JSON
    StaticContentEntryDto:
      description: Holds the information about static content entry
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
          description: Id of the static content entry
          readOnly: true
        name:
          type: string
          description: Name of the static content entry
          pattern: \S
        updatedAt:
          type: string
          format: date-time
          examples:
          - 2022-03-10T12:15:50
          description: Timestamp the static content entry was last updated at
        size:
          type: integer
          format: int64
          description: Size of the static content entry
    StrictTransportSecurityDto:
      type: object
      description: Holds the information about the Strict-Transport-Security (HSTS)
        response header
      required:
      - maxAge
      properties:
        maxAge:
          type: integer
          format: int32
          description: How long (in seconds) the browser should remember that this
            site is only to be accessed using HTTPS
          maximum: 15768000
          minimum: 0
        includeSubDomains:
          type: boolean
          description: Whether the HSTS rule also applies to all of the site's subdomains
        preload:
          type: boolean
          description: Whether the site should be included in browser HSTS preload
            lists
    SupportedKeyAndSignatureForCertificates:
      type: string
      enum:
      - EcdsaP256
      - EcdsaP384
      - Rsa2048_Sha256
      - Rsa3072_Sha256
      - Rsa3072_Sha384
      - Rsa4096_Sha256
      - Rsa4096_Sha384
      - Rsa4096_Sha512
    SupportedKeyType:
      type: string
      enum:
      - EcdsaP521
      - EcdsaP384
      - EcdsaP256
      - Rsa4096
      - Rsa3072
      - Rsa2048
    TextStaticContentEntryDto:
      description: Data object for manipulating text-based static content entries
      type: object
      required:
      - id
      - name
      - contentType
      properties:
        id:
          type: string
          description: Id of the static content entry
          readOnly: true
        name:
          type: string
          description: Name of the static content entry
          pattern: \S
        updatedAt:
          type: string
          format: date-time
          examples:
          - 2022-03-10T12:15:50
          description: Timestamp the static content entry was last updated at
        size:
          type: integer
          format: int64
          description: Size of the static content entry
        contentType:
          description: Static content entry content type
          type: string
          $ref: "#/components/schemas/StaticContentEntryContentType"
        content:
          type: string
          description: Text content of the static content file entry
    ValidateIpPortUniquenessForm:
      description: Provides the information for IP/Port uniqueness validation
      type: object
      properties:
        id:
          type: string
          description: Id of the listener
        ipv4:
          type: string
          description: Listener IPv4 address
        ipv6:
          type: string
          description: Listener IPv6 address
        httpPort:
          type: integer
          format: int32
          description: Listener HTTP port
          maximum: 65535
          minimum: 1
        httpsPort:
          type: integer
          format: int32
          description: Listener HTTPS port
          maximum: 65535
          minimum: 1
    ValidationErrorResponse:
      description: Provides information about request validation failure(s)
      type: object
      required:
      - violations
      properties:
        violations:
          type: array
          items:
            $ref: "#/components/schemas/Violation"
          description: A list of validation violations
    VhostDto:
      type: object
      description: Holds the information about virtual host
      required:
      - id
      - settings
      - ruleEngine
      properties:
        id:
          type: string
          description: Id of the virtual host
          readOnly: true
        settings:
          description: General virtual host settings
          type: object
          $ref: "#/components/schemas/VhostSettingsDto"
        ruleEngine:
          description: Rule engine settings
          type: object
          $ref: "#/components/schemas/VhostRuleEngineDto"
        errorPages:
          type: array
          items:
            $ref: "#/components/schemas/VhostErrorPageDto"
          description: Error pages settings
        maintenancePages:
          type: array
          items:
            $ref: "#/components/schemas/VhostMaintenancePageDto"
          description: Maintenance pages settings
        rateLimit:
          description: Rate limiting settings
          type: object
          $ref: "#/components/schemas/VhostRateLimitDto"
    VhostErrorPageDto:
      type: object
      description: Holds the information about virtual host's error page assignment
      required:
      - responseStatusCode
      - localErrorPageId
      properties:
        responseStatusCode:
          description: Response status code the error page is assigned to
          type: string
          $ref: "#/components/schemas/ErrorPageResponseStatusCode"
        localErrorPageId:
          type: string
          description: Reference to a local error page
        overwriteStatusCode:
          type: integer
          format: int32
          description: A new status code that will be sent to client
          maximum: 599
          minimum: 400
        headerConditions:
          type: array
          items:
            $ref: "#/components/schemas/ErrorPageHeaderConditionDto"
          description: "Additional header conditions, all of which must match for\
            \ the error page to be served"
          maxItems: 16
    VhostExtDto:
      description: Holds the extended information about virtual host
      type: object
      required:
      - id
      - settings
      - ruleEngine
      properties:
        id:
          type: string
          description: Id of the virtual host
          readOnly: true
        settings:
          description: General virtual host settings
          type: object
          $ref: "#/components/schemas/VhostSettingsDto"
        ruleEngine:
          description: Rule engine settings
          type: object
          $ref: "#/components/schemas/VhostRuleEngineDto"
        errorPages:
          type: array
          items:
            $ref: "#/components/schemas/VhostErrorPageDto"
          description: Error pages settings
        maintenancePages:
          type: array
          items:
            $ref: "#/components/schemas/VhostMaintenancePageDto"
          description: Maintenance pages settings
        rateLimit:
          description: Rate limiting settings
          type: object
          $ref: "#/components/schemas/VhostRateLimitDto"
        listener:
          $ref: "#/components/schemas/ListenerDto"
    VhostMaintenancePageDto:
      type: object
      description: Holds the information about virtual host's maintenance page assignment
      properties:
        id:
          type: string
          description: Unique id of the maintenance page assignment
        enabled:
          type: boolean
          description: Whether the maintenance page is served for the assigned routes
        localMaintenancePageId:
          type: string
          description: Reference to a maintenance page
          pattern: \S
        routeIds:
          type: array
          uniqueItems: true
          items:
            type: string
          description: Ids of the routes the maintenance page is assigned to
        allRoutes:
          type: boolean
          description: "When true, the maintenance page is served on all routes of\
            \ the vhost (present and future)"
        statusCode:
          type: integer
          format: int32
          description: HTTP status code returned with the maintenance page
          maximum: 599
          minimum: 100
      required:
      - localMaintenancePageId
      - statusCode
    VhostRateLimitDto:
      type: object
      description: Holds the information about virtual host rate limiting configuration
      properties:
        repeatOffender:
          description: Repeat offender configuration
          type: object
          $ref: "#/components/schemas/RepeatOffenderDto"
        comments:
          type: string
          description: Comments about the rate limiting configuration
    VhostRuleEngineDto:
      type: object
      description: Holds the information about virtual host rule engine configuration
      properties:
        request:
          description: Rule engine request configuration
          type: object
          $ref: "#/components/schemas/RuleEngineRequestDto"
        response:
          description: Rule engine response configuration
          type: object
          $ref: "#/components/schemas/RuleEngineResponseDto"
        debugLogLevel:
          type: integer
          format: int32
          description: Debug log level for the rule engine
          maximum: 9
          minimum: 0
        customRules:
          type: array
          items:
            $ref: "#/components/schemas/RuleEngineCustomRuleDto"
          description: List of custom rules
        comments:
          type: string
          description: Comments about the rule engine request configuration
        coreRuleSetMode:
          description: Core rule set mode
          type: string
          $ref: "#/components/schemas/CoreRuleSetMode"
        paranoiaLevelEnforcing:
          type: integer
          format: int32
          description: Paranoia level for enforcing rules (1-4)
          maximum: 4
          minimum: 1
        paranoiaLevelDetecting:
          type: integer
          format: int32
          description: Paranoia level for detecting rules (1-4)
          maximum: 4
          minimum: 1
        securityLevel:
          type: integer
          format: int32
          description: Security level (1-5)
          maximum: 5
          minimum: 1
        headerValidation:
          description: Header validation configuration (absent means the defaults
            apply)
          type: object
          $ref: "#/components/schemas/RuleEngineHeaderValidationDto"
      required:
      - coreRuleSetMode
      - paranoiaLevelEnforcing
      - paranoiaLevelDetecting
      - securityLevel
    VhostSettingsDto:
      type: object
      description: Holds the information about general virtual host settings
      required:
      - name
      - listenerId
      - hostnames
      properties:
        name:
          type: string
          description: Virtual host name
          pattern: \S
        listenerId:
          type: string
          description: Id of the corresponding listener
        hostnames:
          type: array
          items:
            type: string
            pattern: \S
          description: Virtual host hostnames
        certificateId:
          type: string
          description: Virtual host's certificate Id
        acmeProviderId:
          type: string
          description: Virtual host's ACME provider
        generateHttpToHttpsRedirect:
          type: boolean
          description: Generate HTTP to HTTPS redirect
        strictTransportSecurity:
          description: Strict-Transport-Security (HSTS) response header settings
          type: object
          $ref: "#/components/schemas/StrictTransportSecurityDto"
        routes:
          type: array
          items:
            $ref: "#/components/schemas/RouteDto"
          description: A list of routes belonging to virtual host
        comments:
          type: string
          description: Comments about general virtual host settings
    Violation:
      type: object
      description: Provides the information about a specific violation found during
        request validation
      properties:
        fieldName:
          type: string
          description: Field name
        message:
          type: string
          description: Violation message
      required:
      - message
    WaapCreateCertificateSigningRequestForm:
      type: object
      properties:
        keyTypeAndSignature:
          $ref: "#/components/schemas/SupportedKeyAndSignatureForCertificates"
        subjectForm:
          $ref: "#/components/schemas/CertificateSubjectForm"
        name:
          type: string
        privateKeyId:
          type: string
      required:
      - subjectForm
    WaapCreateSelfSignedCertificateForm:
      type: object
      required:
      - keyTypeAndSignature
      - validityDays
      - subjectForm
      properties:
        keyTypeAndSignature:
          $ref: "#/components/schemas/SupportedKeyAndSignatureForCertificates"
        validityDays:
          type: integer
          format: int32
          exclusiveMinimum: 0
        subjectForm:
          $ref: "#/components/schemas/CertificateSubjectForm"
        alias:
          type: string
    WaapPolicyFileDto:
      description: Holds the information about a policy file
      type: object
      required:
      - name
      - content
      - id
      properties:
        name:
          type: string
          description: Policy file name
          pattern: \S
        contentType:
          description: Media type the policy file is served with; mandatory for types
            that serve it as a response
          type: string
          $ref: "#/components/schemas/WaapPolicyFileMediaType"
        content:
          type: string
          description: Policy file content
          pattern: \S
        id:
          type: string
          description: Id of the policy file
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          examples:
          - 2022-03-10T12:15:50
          description: Timestamp the policy file was last updated at
        references:
          type: array
          items:
            $ref: "#/components/schemas/WaapPolicyFileReferenceVhostDto"
          description: Policy file's references in Virtual Hosts
    WaapPolicyFileForm:
      description: User-editable section of a policy file
      type: object
      required:
      - name
      - content
      properties:
        name:
          type: string
          description: Policy file name
          pattern: \S
        contentType:
          description: Media type the policy file is served with; mandatory for types
            that serve it as a response
          type: string
          $ref: "#/components/schemas/WaapPolicyFileMediaType"
        content:
          type: string
          description: Policy file content
          pattern: \S
    WaapPolicyFileMediaType:
      type: string
      enum:
      - TEXT_PLAIN
      - TEXT_HTML
      - APPLICATION_JSON
    WaapPolicyFileReferenceVhostDto:
      type: object
      description: Holds the information about a policy file reference's vhost
      properties:
        vhostId:
          type: string
          description: Virtual host id
        description:
          type: string
          description: Virtual host description
    WaapPolicyFileType:
      type: string
      enum:
      - error-page
      - maintenance-page
    XFrameOptions:
      type: string
      enum:
      - DENY
      - SAMEORIGIN
  securitySchemes:
    apiClientToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Access token of an API client, requested from `<baseUri>/dex/token`\
        \ with the OAuth 2.0 client credentials grant and the scopes `openid profile\
        \ groups`."
tags:
- name: BackendApi
  description: Operations related to Aero WAAP backends management
- name: CertificatesAcmeApi
  description: Operations related to Aero WAAP ACME Certificates settings management
- name: CertificatesApi
  description: Operations related to Aero WAAP Certificates settings management
- name: ListenerApi
  description: Operations related to Aero WAAP listener management
- name: SecRulesApi
  description: Operations related to Aero WAAP security rules management
- name: StaticContentApi
  description: Operations related to Aero Static Content management
- name: VhostsApi
  description: Operations related to Aero WAAP virtual hosts management
- name: WaapPolicyFilesApi
  description: Operations related to Aero WAAP policy files (error pages and maintenance
    pages) management
paths:
  /api/acme:
    get:
      summary: Get all ACME providers
      operationId: getAcmeProviders
      tags:
      - CertificatesAcmeApi
      responses:
        "200":
          description: Providers retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AcmeProviderDto"
    post:
      summary: Create ACME provider
      operationId: createAcmeProvider
      tags:
      - CertificatesAcmeApi
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcmeProviderDto"
        required: true
      responses:
        "201":
          description: ACME provider created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcmeProviderDto"
        "400":
          description: Update failed due to non-existing trusted CA certificate id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Create failed due to invalid or unprocessable request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
  /api/acme/data:
    get:
      summary: Get form data for Edit ACME provider dialog
      operationId: getEditAcmeProviderFormData
      tags:
      - CertificatesAcmeApi
      responses:
        "200":
          description: Form data retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditAcmeProviderFormData"
  /api/acme/{id}:
    put:
      summary: Update ACME provider
      operationId: updateAcmeProvider
      tags:
      - CertificatesAcmeApi
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcmeProviderDto"
        required: true
      responses:
        "200":
          description: ACME provider updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcmeProviderDto"
        "400":
          description: |-
            Update failed. Possible reasons:

            - invalid id- non-existing trusted CA certificate id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Update failed due to invalid or unprocessable request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
    get:
      summary: Get ACME provider
      operationId: getAcmeProvider
      tags:
      - CertificatesAcmeApi
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: ACME provider retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcmeProviderDto"
        "400":
          description: Retrieval failed due to invalid id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: Delete ACME provider
      operationId: deleteAcmeProvider
      tags:
      - CertificatesAcmeApi
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: ACME provider deleted successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AcmeProviderDto"
        "400":
          description: Delete failed due to invalid id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/backend:
    get:
      summary: Get all backends
      operationId: getBackends
      tags:
      - BackendApi
      responses:
        "200":
          description: List retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BackendDto"
    post:
      summary: Create backend
      operationId: createBackend
      tags:
      - BackendApi
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackendDto"
        required: true
      responses:
        "201":
          description: Backend created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackendDto"
        "422":
          description: Create failed due to invalid or unprocessable request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
  /api/backend/certs:
    get:
      summary: Get all certificates available for backend
      operationId: getAvailableBackendCertificates
      tags:
      - BackendApi
      responses:
        "200":
          description: Information retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificatesDataDto"
  /api/backend/{id}:
    put:
      summary: Update backend
      operationId: updateBackend
      tags:
      - BackendApi
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackendDto"
        required: true
      responses:
        "200":
          description: Backend updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackendDto"
        "400":
          description: Update failed due to invalid id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Update failed due to invalid or unprocessable request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
    get:
      summary: Get backend
      operationId: getBackend
      tags:
      - BackendApi
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Backend retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackendDto"
        "400":
          description: Retrieval failed due to invalid id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: Delete backend
      operationId: deleteBackend
      tags:
      - BackendApi
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Backend deleted successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BackendDto"
        "400":
          description: Delete failed due to invalid id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "417":
          description: Delete failed due to backend being referenced by route(s).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/certificates:
    get:
      summary: Get Certificates settings
      operationId: getCertificatesData
      tags:
      - CertificatesApi
      responses:
        "200":
          description: Certificates settings retrieved successfully.
          content:
