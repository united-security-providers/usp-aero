  variables:
    baseUri:
      default: https://aero.example.com
      description: "Scheme and address of your appliance, as you open the management\
        \ GUI, e.g. `https://aero.example.com`. In an HA cluster, the cluster's address."
info:
  title: Aero Platform Management API
  version: 0.0.0-main-SNAPSHOT
  description: Authenticate every request with the access token of an API client.
    See "Access the management API" in the user documentation.
