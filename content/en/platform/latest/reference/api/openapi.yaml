---
openapi: 3.1.0
components:
  schemas:
    AcmeSettingsDto:
      type: object
      description: Automatic certificate renewal (ACME) settings
      properties:
        subjectAltNames:
          type: string
          description: Subject alternative name(s)
        certificateAuthorityUrl:
          type: string
          description: Certificate authority URL
          pattern: \S
        trustedCaCertificateId:
          type: string
          description: Trusted CA Certificate
        skipCertificateValidation:
          type: boolean
          description: Certificate validation will be skipped
        contactEmailAddress:
          type: string
          description: Contact email address
          pattern: \S
        keyType:
          description: Key type
          type: string
          $ref: "#/components/schemas/SupportedKeyType"
        eabKeyId:
          type: string
          description: "External Account Binding (EAB): Key ID"
        eabHmacKey:
          type: string
          description: "External Account Binding (EAB): HMAC Key"
      required:
      - certificateAuthorityUrl
      - contactEmailAddress
      - keyType
    ApiClientDto:
      description: Holds the information about an API client. Never contains the secret.
      type: object
      properties:
        description:
          type: string
          description: Free text describing what the API client is used for
          maxLength: 255
        role:
          description: Role of the API client
          type: string
          $ref: "#/components/schemas/ApiClientRole"
        enabled:
          type: boolean
          description: Whether the API client may obtain tokens (after the next activation)
        id:
          type: string
          description: "API client ID, used as OAuth2 client ID and as principal name"
          pattern: "[a-z0-9-]{3,40}"
        createdAt:
          type: string
          format: date-time
          examples:
          - 2022-03-10T16:15:50Z
          description: When the API client was created
        secretRotatedAt:
          type: string
          format: date-time
          examples:
          - 2022-03-10T16:15:50Z
          description: When the secret was last generated
        secretOverdue:
          type: boolean
          description: Whether the secret is older than the configured maximum age
            and should be rotated
      required:
      - role
      - id
    ApiClientRole:
      type: string
      enum:
      - ADMINISTRATOR
      - VIEWER
    ApiClientWithSecretDto:
      description: "API client including its secret. Only returned once, when the\
        \ client is created or its secret is regenerated."
      type: object
      properties:
        description:
          type: string
          description: Free text describing what the API client is used for
          maxLength: 255
        role:
          description: Role of the API client
          type: string
          $ref: "#/components/schemas/ApiClientRole"
        enabled:
          type: boolean
          description: Whether the API client may obtain tokens (after the next activation)
        id:
          type: string
          description: "API client ID, used as OAuth2 client ID and as principal name"
          pattern: "[a-z0-9-]{3,40}"
        createdAt:
          type: string
          format: date-time
          examples:
          - 2022-03-10T16:15:50Z
          description: When the API client was created
        secretRotatedAt:
          type: string
          format: date-time
          examples:
          - 2022-03-10T16:15:50Z
          description: When the secret was last generated
        secretOverdue:
          type: boolean
          description: Whether the secret is older than the configured maximum age
            and should be rotated
        secret:
          type: string
          description: Client secret. Shown only once; it takes effect with the next
            activation.
      required:
      - role
      - id
      - secret
    AvailableComponentDto:
      description: Holds the information about available comonent.
      type: object
      required:
      - componentName
      - componentVersion
      properties:
        componentName:
          type: string
          description: Name of the component
        componentVersion:
          type: string
          description: Version of the component
          format: semver
    BackupJobDto:
      description: Holds the information about automated backup job
      type: object
      properties:
        id:
          type: string
          description: Id of the backup
        name:
          type: string
          description: Name of the backup
          pattern: \S
        targetId:
          type: string
          description: Id of the associated backup target; null means local target
        scheduleCron:
          type: string
          description: Backup schedule in CRON format
          pattern: \S
        type:
          description: Backup type
          type: string
          $ref: "#/components/schemas/BackupType"
      required:
      - name
      - scheduleCron
      - type
    BackupTargetDto:
      description: Holds the information about a target of the automated backup job
      type: object
      properties:
        id:
          type: string
          description: Backup target id
        name:
          type: string
          description: Backup target name
        host:
          type: string
          description: Backup target host
          pattern: \S
        port:
          type: integer
          format: int32
          description: Backup target port
          maximum: 65535
          minimum: 1
        username:
          type: string
          description: Username to be used when accessing backup target
          pattern: \S
        targetDirectoryPath:
          type: string
          description: Directory path on a target system
          pattern: \S
        type:
          description: Backup target type
          type: string
          $ref: "#/components/schemas/BackupTargetType"
        sshPublicKey:
          type: string
          description: SSH public key that will be used when accessing backup target
      required:
      - host
      - port
      - username
      - targetDirectoryPath
      - type
    BackupTargetType:
      type: string
      enum:
      - SCP
      - SFTP
    BackupType:
      type: string
      enum:
      - FULL
    CaCertificateDownloadFormat:
      description: CA certificate download formats
      type: string
      enum:
      - PEM
      - DER
      - PKCS7
    CaCertificateInfoDto:
      description: CA certificate info
      type: object
      properties:
        subject:
          type: string
        issuer:
          type: string
        subjectElements:
          type: array
          items:
            type: object
            required:
            - key
            - value
            properties:
              key:
                type: string
              value:
                type: string
        issuerElements:
          type: array
          items:
            type: object
            required:
            - key
            - value
            properties:
              key:
                type: string
              value:
                type: string
        validFrom:
          type: string
          format: date
          examples:
          - 2022-03-10
        validUntil:
          type: string
          format: date
          examples:
          - 2022-03-10
        commonNames:
          type: array
          items:
            type: string
        keyUsage:
          type: array
          items:
            $ref: "#/components/schemas/KeyUsageName"
        signatureAlgorithm:
          type: string
        keySize:
          type: integer
          format: int32
        keyType:
          $ref: "#/components/schemas/SupportedKeyType"
        fingerprint:
          type: string
        serialNumber:
          type: string
        isCaCertificate:
          type: boolean
        isSelfSigned:
          type: boolean
        subjectAlternativeNames:
          type: array
          items:
            type: object
            required:
            - key
            - value
            properties:
              key:
                type: string
              value:
                type: string
        notYetValid:
          type: boolean
        expired:
          type: boolean
        keyOnly:
          type: boolean
        id:
          type: string
          description: Certificate id
        alias:
          type: string
          description: Certificate alias (optional)
        aliasLabel:
          type: string
          description: Certificate alias label (alias or certificate's common name)
        inUse:
          type: boolean
          description: Certificate is in use in the configuration
      required:
      - keyType
      - fingerprint
      - keyOnly
      - id
      - aliasLabel
      - inUse
    CaCertificatesDto:
      type: object
      description: CA certificates settings
      properties:
        caCertificates:
          type: array
          items:
            $ref: "#/components/schemas/CaCertificateInfoDto"
          description: A list of CA certificate infos
    CertificateDownloadFormat:
      description: Certificate download formats
      type: string
      enum:
      - PKCS12
      - JKS
    CertificateInfoDto:
      description: Certificate info
      type: object
      properties:
        subject:
          type: string
        issuer:
          type: string
        subjectElements:
          type: array
          items:
            type: object
            required:
            - key
            - value
            properties:
              key:
                type: string
              value:
                type: string
        issuerElements:
          type: array
          items:
            type: object
            required:
            - key
            - value
            properties:
              key:
                type: string
              value:
                type: string
        validFrom:
          type: string
          format: date
          examples:
          - 2022-03-10
        validUntil:
          type: string
          format: date
          examples:
          - 2022-03-10
        commonNames:
          type: array
          items:
            type: string
        keyUsage:
          type: array
          items:
            $ref: "#/components/schemas/KeyUsageName"
        signatureAlgorithm:
          type: string
        keySize:
          type: integer
          format: int32
        keyType:
          $ref: "#/components/schemas/SupportedKeyType"
        fingerprint:
          type: string
        serialNumber:
          type: string
        isCaCertificate:
          type: boolean
        isSelfSigned:
          type: boolean
        subjectAlternativeNames:
          type: array
          items:
            type: object
            required:
            - key
            - value
            properties:
              key:
                type: string
              value:
                type: string
        notYetValid:
          type: boolean
        expired:
          type: boolean
        keyOnly:
          type: boolean
        id:
          type: string
          description: Certificate id
        alias:
          type: string
          description: Certificate alias (optional)
        aliasLabel:
          type: string
          description: Certificate alias label (alias or certificate's common name)
        inUse:
          type: boolean
          description: Certificate is in use in the configuration
      required:
      - keyType
      - fingerprint
      - keyOnly
      - id
      - aliasLabel
      - inUse
    CertificateSubjectForm:
      type: object
      required:
      - commonName
      properties:
        commonName:
          type: string
          pattern: \S
          maxLength: 64
        alternativeDomainNames:
          type: string
        country:
          type: string
        stateOrProvince:
          type: string
        locality:
          type: string
        organization:
          type: string
        organizationalUnit:
          type: string
        emailAddress:
          type: string
    CertificatesDto:
      type: object
      description: Certificates settings
      properties:
        certificates:
          type: array
          items:
            $ref: "#/components/schemas/CertificateInfoDto"
          description: A list of certificate infos
    CertificatesSettingsDto:
      description: Holds the information about Certificates settings.
      type: object
      properties:
        managementAccess:
          description: Management access settings
          type: object
          $ref: "#/components/schemas/ManagementAccessSettingsDto"
        certificates:
          description: Certificates settings
          type: object
          $ref: "#/components/schemas/CertificatesDto"
        caCertificates:
          description: CA certificates settings
          type: object
          $ref: "#/components/schemas/CaCertificatesDto"
    CertificatesSettingsFormData:
      description: Holds the form data required to display Certificates settings
      type: object
      required:
      - keyTypeList
      - certificatesSettings
      properties:
        keyTypeList:
          type: array
          items:
            type: string
          description: A list of supported Key types
        certificatesSettings:
          description: Certificates settings
          type: object
          $ref: "#/components/schemas/CertificatesSettingsDto"
    ChangePasswordForm:
      description: Holds the information required to change user's password.
      type: object
      required:
      - newPassword
      - repeatPassword
      properties:
        newPassword:
          type: string
          description: New password
        repeatPassword:
          type: string
          description: Repeat password
    ClusterNodeDto:
      description: Represents a cluster node configuration.
      type: object
      required:
      - hostname
      - ipAddress
      - sshPublicKey
      properties:
        hostname:
          type: string
          description: Hostname of the cluster node
          pattern: \S
        ipAddress:
          type: string
          description: IP address of the cluster node
          pattern: \S
        sshPublicKey:
          type: string
          description: SSH public key of the cluster node
          pattern: \S
    ComponentDeploymentDto:
      description: Component Deployment holds the information about a component that
        is available for the installation on the AERO platform
      type: object
      required:
      - componentName
      - componentVersion
      - componentImage
      properties:
        componentName:
          type: string
          description: Name of the component
        componentVersion:
          type: string
          description: Version of the component
          format: semver
        componentImage:
          type: string
          description: Docker image of the component
    ComponentRevisionsInfoDto:
      description: Holds the information about component's revisions
      type: object
      required:
      - componentName
      properties:
        componentName:
          type: string
          description: Name of the component
        draftId:
          type: string
          description: Id of the current draft version (if any)
        parentRevisionForReviewableChanges:
          description: "If component configuration has changes, will contain the revision\
            \ these changes are based on"
          type: object
          $ref: "#/components/schemas/ConfigurationRevisionDto"
        activationStatus:
          description: Status of the in-progress or last activation (if any)
          type: string
          $ref: "#/components/schemas/InfrastructureOperationStatusCode"
        activationRevision:
          description: Configuration revision that's currently being activated or
            just finished activation (if any)
          type: object
          $ref: "#/components/schemas/ConfigurationRevisionDto"
        revisions:
          type: array
          items:
            $ref: "#/components/schemas/ConfigurationRevisionDto"
          description: Component's configuration revisions
        validationErrors:
          type: array
          items:
            $ref: "#/components/schemas/ConfigurationValidationError"
          description: A list of configuration validation errors for the latest activatable
            revision
    ComponentVersionMismatchDto:
      description: Holds the information about version mismatch between installed
        component & backup content
      type: object
      required:
      - componentName
      properties:
        componentName:
          type: string
          description: Name of the component
        backupVersion:
          type: string
          description: Version in backup
        installedVersion:
          type: string
          description: Installed version
    ConfigurableComponentDto:
      description: Configurable Component holds the information about a component
        that have configuration
      type: object
      required:
      - componentName
      properties:
        componentName:
          type: string
          description: Name of the component
    ConfigurationActivationComponentInfoDto:
      description: Holds the information about component's configuration activation
      type: object
      required:
      - componentName
      properties:
        componentName:
          type: string
          description: Name of the component
        revision:
          description: "Revision available for activation, or null if none"
          type: object
          $ref: "#/components/schemas/ConfigurationRevisionDto"
        status:
          description: "Configuration activation status, or null if none"
          type: object
          $ref: "#/components/schemas/ConfigurationActivationComponentStatusDto"
        validationErrors:
          type: array
          items:
            $ref: "#/components/schemas/ConfigurationValidationError"
          description: A list of configuration validation errors for the activatable
            revision
    ConfigurationActivationComponentStatusDto:
      type: object
      description: Holds the information about component's configuration activation
        status
      required:
      - code
      - revision
      properties:
        code:
          description: Activation status code
          type: string
          $ref: "#/components/schemas/InfrastructureOperationStatusCode"
        revision:
          description: Revision that was used for configuration activation
          type: object
          $ref: "#/components/schemas/ConfigurationRevisionDto"
        message:
          type: string
          description: Activation status message (optional)
    ConfigurationActivationInfosDto:
      description: Holds the information about all component's configuration activations
      type: object
      required:
      - infos
      properties:
        infos:
          type: array
          items:
            $ref: "#/components/schemas/ConfigurationActivationComponentInfoDto"
          description: List of all component's configuration activations
        status:
          description: "Overall configuration activation status, or null if none"
          type: object
          $ref: "#/components/schemas/ConfigurationActivationStatusDto"
    ConfigurationActivationStatusDto:
      type: object
      description: Holds the information about overall configuration activation status
      required:
      - code
      properties:
        code:
          description: Activation status code
          type: string
          $ref: "#/components/schemas/InfrastructureOperationStatusCode"
        start:
          type: string
          format: date
          examples:
          - 2022-03-10
          description: "Activation start time, or null if none"
        end:
          type: string
          format: date
          examples:
          - 2022-03-10
          description: "Activation end time, or null if none"
    ConfigurationRevisionDetailsDto:
      description: Holds information about configuration revision
      type: object
      required:
      - id
      - revision
      - diffVersion
      properties:
        id:
          type: string
          description: Revision id
        revision:
          type: integer
          format: int64
          description: Revision number
        comment:
          type: string
          description: Revision comment
        createdAt:
          type: string
          format: date-time
          examples:
          - 2022-03-10T12:15:50
          description: Timestamp the revision was created at
        updatedAt:
          type: string
          format: date-time
          examples:
          - 2022-03-10T12:15:50
          description: Timestamp the revision was last updated at
        activatedAt:
          type: string
          format: date-time
          examples:
          - 2022-03-10T12:15:50
          description: Timestamp the revision was activated (deployed) at
        previousVersionId:
          type: string
          description: Id of the revision preceding this one
        schemaVersion:
          type: integer
          format: int32
          description: Configuration schema version
        author:
          type: string
          description: Revision author
        diffVersion:
          description: Configuration revision that was used as an 'old' version for
            diff
          type: object
          $ref: "#/components/schemas/DiffVersionDto"
        diffContent:
          type: array
          items:
            $ref: "#/components/schemas/DiffContentDto"
          description: A list of diff content entries
        isLatest:
          type: boolean
          description: If this configuration revision is the latest one
        validationErrors:
          type: array
          items:
            $ref: "#/components/schemas/ConfigurationValidationError"
          description: A list of configuration validation errors
        latest:
          type: boolean
    ConfigurationRevisionDto:
      type: object
      description: Holds the information about configuration revision
      required:
      - id
      - revision
      properties:
        id:
          type: string
          description: Revision id
        revision:
          type: integer
          format: int64
          description: Revision number
        comment:
          type: string
          description: Revision comment
        createdAt:
          type: string
          format: date-time
          examples:
          - 2022-03-10T12:15:50
          description: Timestamp the revision was created at
        updatedAt:
          type: string
          format: date-time
          examples:
          - 2022-03-10T12:15:50
          description: Timestamp the revision was last updated at
        activatedAt:
          type: string
          format: date-time
          examples:
          - 2022-03-10T12:15:50
          description: Timestamp the revision was activated (deployed) at
        previousVersionId:
          type: string
          description: Id of the revision preceding this one
        schemaVersion:
          type: integer
          format: int32
          description: Configuration schema version
        author:
          type: string
          description: Revision author
    ConfigurationValidationError:
      type: object
      required:
      - type
      - arguments
      properties:
        type:
          $ref: "#/components/schemas/ConfigurationValidationErrorType"
        arguments:
          type: array
          items:
            type: string
    ConfigurationValidationErrorType:
      type: string
      enum:
      - INCOMPATIBLE_COMPONENT_VERSION
      - HOST_NON_EXISTING_CONFIGURED_INTERFACE
      - HOST_AT_LEAST_TWO_CONFIGURED_INTERFACES_REQUIRED
      - HOST_HA_UNAVAILABLE_FOR_DHCP
      - HOST_SYSTEM_HOSTNAME_NOT_IN_HA_CONFIG
      - HOST_SYSTEM_IP_NOT_IN_HA_CONFIG
      - WAAP_EXTERNAL_IFACE_NOT_CONFIGURED
      - WAAP_MISSING_LISTENER_IP
    ContainerSettingsDto:
      description: Holds the information about Container settings.
      type: object
      required:
      - hostname
      properties:
        hostname:
          type: string
          description: Container registry hostname
        port:
          type: integer
          format: int32
          description: Container registry port
          maximum: 65535
          minimum: 1
        tlsEnabled:
          type: boolean
          description: TLS will be enabled when accessing the container registry
        disableServerCertificateValidation:
          type: boolean
          description: Server certificate validation will be disabled when accessing
            the container registry
        trustedCaCertificateId:
          type: string
          description: Trusted CA Certificate
        username:
          type: string
          description: Username to use when accessing the container registry
          maxLength: 255
        password:
          type: string
          description: Password to use when accessing the container registry
          maxLength: 255
        imageNamespacePrefix:
          type: string
          description: Namespace prefix of the image
          maxLength: 255
    CoreHostCreateSelfSignedCertificateForm:
      type: object
      required:
      - keyTypeAndSignature
      - validityDays
      - subjectForm
      properties:
        keyTypeAndSignature:
          $ref: "#/components/schemas/SupportedKeyAndSignatureForCertificates"
        validityDays:
          type: integer
          format: int32
          exclusiveMinimum: 0
        subjectForm:
          $ref: "#/components/schemas/CertificateSubjectForm"
        alias:
          type: string
    CreateApiClientForm:
      description: Holds the information about an API client to be created.
      type: object
      properties:
        description:
          type: string
          description: Free text describing what the API client is used for
          maxLength: 255
        role:
          description: Role of the API client
          type: string
          $ref: "#/components/schemas/ApiClientRole"
        enabled:
          type: boolean
          description: Whether the API client may obtain tokens (after the next activation)
        id:
          type: string
          description: "API client ID, used as OAuth2 client ID and as principal name"
          pattern: "[a-z0-9-]{3,40}"
      required:
      - role
      - id
    CreateIdentityProviderForm:
      description: Holds the information about identity provider to be created.
      type: object
      required:
      - name
      - type
      properties:
        name:
          type: string
          description: Provider name
          pattern: \S
        ldap:
          $ref: "#/components/schemas/LdapIdentityProviderSettingsDto"
        type:
          description: Provider type
          type: string
          $ref: "#/components/schemas/IdentityProviderType"
    CreateSelfSignedCertificateFormData:
      description: Holds the form data required to display Create self-signed certificate
        dialog
      type: object
      required:
      - keyTypeList
      properties:
        keyTypeList:
          type: array
          items:
            type: string
          description: A list of supported Key types
    CreateUserForm:
      description: Holds the information about a user to be created.
      type: object
      required:
      - displayname
      - email
      - role
      - username
      properties:
        displayname:
          type: string
          description: Displayname
          pattern: \S
          maxLength: 32
        email:
          type: string
          description: Email
          pattern: \S
        role:
          description: Role of the user
          type: string
          $ref: "#/components/schemas/Role"
        password:
          type: string
          description: Password
        username:
          type: string
          description: Username
          pattern: "^[A-Za-z0-9]+$"
          maxLength: 32
    DiffContentDto:
      type: object
      description: Holds information about diff content
      properties:
        description:
          type: string
          description: Entry description
        oldContent:
          type: string
          description: Entry old content
        newContent:
          type: string
          description: Entry new content
    DiffVersionDto:
      type: object
      description: Holds information about configuration revision that was used as
        an 'old' version for diff
      properties:
        id:
          type: string
          description: Revision id
        revision:
          type: integer
          format: int64
          description: Revision number
    DynamicIpAddressInfoDto:
      type: object
      description: Dynamic IP address info
      properties:
        ipv4Enabled:
          type: boolean
          description: IPv4 address will be used
        ipv6Enabled:
          type: boolean
          description: IPv6 address will be used
        dhcpClientId:
          type: string
          description: DHCP client id
        dnsServers:
          type: array
          items:
            type: string
            pattern: \S
          description: A list of DNS servers (IPv4/v6 or FQDN)
          maxItems: 3
        dnsSearchQueries:
          type: array
          items:
            type: string
            pattern: \S
          description: A list of DNS search queries
        routes:
          type: array
          items:
            $ref: "#/components/schemas/DynamicRouteInfoDto"
          description: A list of route infos
    DynamicRouteInfoDto:
      type: object
      description: Dynamic IP route info
      required:
      - networkCidr
      - nextHopIpAddress
      properties:
        networkCidr:
          type: string
          description: IPv4/v6 route Network address in CIDR format
          pattern: \S
        nextHopIpAddress:
          type: string
          description: IPv4/v6 route Next Hop address
          pattern: \S
    EffectiveInterfaceInfoDto:
      type: object
      properties:
        name:
          type: string
          description: Interface name
        ipAddresses:
          type: array
          items:
            type: string
          description: A list of assigned IP addresses
        macAddress:
          type: string
          description: Interface MAC address
        state:
          description: Interface connection state
          type: string
          $ref: "#/components/schemas/NetworkInterfaceState"
    ErrorResponse:
      description: Provides the information about invalid request
      type: object
      required:
      - reason
      properties:
