      description: "Access token of an API client, requested from `<baseUri>/dex/token`\
        \ with the OAuth 2.0 client credentials grant and the scopes `openid profile\
        \ groups`."
tags:
- name: ApiClientsApi
  description: Operations related to API clients (OAuth2 Client Credentials)
- name: BackupApi
  description: Operations related to Aero backup management
- name: CertificatesSettingsApi
  description: Operations related to Aero's Certificates settings management
- name: ComponentManagementApi
  description: Operations related to Aero component management
- name: ConfigurationLifecycleManagerApi
  description: Operations related to Aero configuration revisions and activation
- name: ContainerSettingsApi
  description: Operations related to Aero's Container settings management
- name: HighAvailabilityConfigurationApi
  description: Operations related to Aero's High Availability configuration management
- name: HighAvailabilityRuntimeApi
  description: Operations related to Aero's High Availability runtime management
- name: Live-Log API
  description: Operations related to Aero's Live-Log management
- name: LogSettingsApi
  description: Operations related to Aero's Log Settings configuration management
- name: MonitoringSettingsApi
  description: Operations related to Aero's Monitoring settings management
- name: NetworkSettingsApi
  description: Operations related to Aero's Network settings management
- name: OperatingSystemApi
  description: Operations related to Aero operating system management
- name: SystemSettingsApi
  description: Operations related to Aero's System settings management
- name: UserManagementApi
  description: Operations related to Aero's user management
paths:
  /api/api-clients:
    get:
      summary: Get all API clients
      operationId: getClients
      tags:
      - ApiClientsApi
      responses:
        "200":
          description: List retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiClientDto"
    post:
      summary: Create API client
      description: Generates the client secret and returns it once. The client takes
        effect with the next activation.
      operationId: createClient
      tags:
      - ApiClientsApi
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiClientForm"
        required: true
      responses:
        "201":
          description: API client created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiClientWithSecretDto"
        "422":
          description: "Create failed due to invalid or unprocessable request, e.g.\
            \ an ID that is reserved or already used by an API client or a local user."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "403":
          description: Not allowed for API clients.
  /api/api-clients/{id}:
    put:
      summary: Update API client
      description: "Updates description, role and enabled. The secret is kept."
      operationId: updateClient
      tags:
      - ApiClientsApi
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateApiClientForm"
        required: true
      responses:
        "200":
          description: API client updated successfully.
          content:
            application/json:
              schema:
